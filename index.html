<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קייטנת שירי – קיץ 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:linear-gradient(180deg,#87CEEB,#B0E2FF);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 60px;}
.poster-wrap{width:100%;max-width:420px;border-radius:20px;overflow:hidden;box-shadow:0 12px 50px rgba(0,0,0,0.25);}
.poster-img{width:100%;display:block;}
.btn-wrap{width:100%;max-width:420px;margin-top:18px;text-align:center;}
.pulse-btn{display:block;background:linear-gradient(135deg,#FF1493,#C2185B);color:#fff;font-family:'Heebo',sans-serif;font-size:20px;font-weight:900;padding:16px 36px;border-radius:50px;border:3px solid #FFD600;box-shadow:0 5px 20px rgba(233,30,140,0.45);animation:pulse 1.8s infinite;cursor:pointer;text-align:center;width:100%;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.04);}100%{transform:scale(1);}}
.hint{color:#fff;font-size:13px;font-weight:500;margin-top:10px;text-shadow:0 1px 4px rgba(0,0,0,0.3);}
.count-badge{background:rgba(255,255,255,0.95);color:#C2185B;padding:8px 18px;border-radius:50px;font-size:14px;font-weight:900;margin-top:12px;display:inline-block;box-shadow:0 3px 12px rgba(0,0,0,0.15);}
.admin-toggle{margin-top:28px;}
.btn-admin{background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);color:#fff;font-family:'Heebo',sans-serif;font-size:14px;font-weight:700;padding:10px 24px;border-radius:50px;cursor:pointer;text-decoration:none;display:inline-block;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;overflow-y:auto;padding:20px 12px;}
.modal.active{display:block;}
.modal-content{background:#fff;max-width:500px;margin:0 auto;border-radius:20px;padding:24px;position:relative;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:16px;border-bottom:2px solid #f0f0f0;}
.modal-title{font-size:22px;font-weight:900;color:#C2185B;}
.btn-close{background:#f5f5f5;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;font-weight:700;color:#666;}
.child-block{background:#FFF9E6;border:2px solid #FFD600;border-radius:16px;padding:16px;margin-bottom:16px;position:relative;}
.child-title{font-weight:900;color:#C2185B;margin-bottom:12px;font-size:16px;}
.btn-remove{position:absolute;top:12px;left:12px;background:#FF5252;color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:12px;cursor:pointer;font-family:'Heebo',sans-serif;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:14px;font-weight:700;color:#333;margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:2px solid #E1E1E1;border-radius:10px;font-size:15px;font-family:'Heebo',sans-serif;background:#fff;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#C2185B;}
.field textarea{min-height:60px;resize:vertical;}
.field .req{color:#FF5252;}
.btn-add{background:#FFD600;color:#333;border:none;padding:12px 20px;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;width:100%;margin-bottom:16px;font-family:'Heebo',sans-serif;}
.terms-box{background:#F3E5F5;border-radius:12px;padding:14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.terms-box input{margin-top:3px;flex-shrink:0;}
.terms-box label{font-size:14px;line-height:1.5;color:#333;cursor:pointer;}
.terms-box a{color:#C2185B;font-weight:700;}
.btn-submit{background:linear-gradient(135deg,#4CAF50,#2E7D32);color:#fff;border:none;padding:16px;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;width:100%;font-family:'Heebo',sans-serif;box-shadow:0 4px 12px rgba(76,175,80,0.4);}
.btn-submit:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;}
.success-msg{background:#E8F5E9;border:2px solid #4CAF50;border-radius:16px;padding:20px;text-align:center;}
.success-msg h3{color:#2E7D32;margin-bottom:10px;font-size:20px;}
.success-msg p{color:#333;font-size:15px;line-height:1.6;}
.btn-another{background:#FFD600;color:#333;border:none;padding:12px 20px;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;margin-top:14px;font-family:'Heebo',sans-serif;}
footer{color:rgba(255,255,255,0.6);font-size:12px;margin-top:24px;text-align:center;}
</style>
</head>

        <label>אני מאשר/ת את תנאי הקייטנה ואת מדיניות הפרטיות ומסכים/ה לקבלת הודעות בנוגע לקייטנה</label>
      </div>
      
      <button class="btn-submit" id="submitBtn" onclick="submitForm()">📋 שליחת טופס הרשמה</button>
    </div>
    
    <div id="successSection" style="display:none;">
      <div class="success-msg">
        <h3>🎉 ההרשמה נקלטה בהצלחה!</h3>
        <p>תודה רבה על ההרשמה לקייטנת שירי!<br>ניצור איתך קשר בהקדם לאישור ותיאום התשלום.</p>
        <button class="btn-another" onclick="resetForm()">הרשמת ילד/ה נוסף/ת</button>
      </div>
    </div>
  </div>
</div>

<footer>קייטנת שירי • 11.8–25.8.2026 • 050-9718939</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
// Initialize Firebase
const firebaseConfig = {
      apiKey: "AIzaSyCM-orSuzfoG_pK2qFUPnuIQRiCXi9pBL4",
      authDomain: "keytanat-shiri.firebaseapp.com",
      databaseURL: "https://keytanat-shiri-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "keytanat-shiri",
      messagingSenderId: "936210340060",
      appId: "1:936210340060:web:970a35ec0b72040e017c19"
    };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Initialize EmailJS
emailjs.init({ publicKey: "_5Xk_oW8cVpeFydEI" });

// Live counter
db.ref('registrations').on('value', function(snap) {
  const data = snap.val() || {};
  const count = Object.keys(data).length;
  if (count > 0) {
    document.getElementById('regCount').textContent = count;
    document.getElementById('countBadge').style.display = 'inline-block';
  }
});

let childCount = 1;

function openForm() {
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeForm() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}
function addChild() {
  childCount++;
  const c = document.createElement('div');
  c.className = 'child-block';
  c.dataset.child = childCount;
  c.innerHTML = `
    <div class="child-title">👶 פרטי הילד/ה ` + childCount + `</div>
    <button class="btn-remove" onclick="removeChild(` + childCount + `)">✕ הסר</button>
    <div class="field"><label>שם מלא <span class="req">*</span></label><input type="text" class="child-name" required></div>
    <div class="field"><label>תעודת זהות <span class="req">*</span></label><input type="text" class="child-id" inputmode="numeric" maxlength="9" required></div>
    <div class="field"><label>תאריך לידה <span class="req">*</span></label><input type="date" class="child-dob" required></div>
    <div class="field"><label>שם בית הספר / גן <span class="req">*</span></label><input type="text" class="child-school" required></div>
    <div class="field"><label>כיתה / גיל <span class="req">*</span></label><input type="text" class="child-grade" required></div>
  `;
  document.getElementById('childrenContainer').appendChild(c);
}
function removeChild(n) {
  const el = document.querySelector('[data-child="' + n + '"]');
  if (el) el.remove();
}

async function submitForm() {
  const btn = document.getElementById('submitBtn');
  const parentName = document.getElementById('parentName').value.trim();
  const parentPhone = document.getElementById('parentPhone').value.trim();
  const terms = document.getElementById('terms').checked;
  
  if (!parentName || !parentPhone) { alert('חסרים פרטי הורה'); return; }
  if (!terms) { alert('יש לאשר את תנאי הקייטנה'); return; }
  
  const children = [];
  document.querySelectorAll('.child-block[data-child]').forEach(function(block) {
    const name = block.querySelector('.child-name').value.trim();
    const id = block.querySelector('.child-id').value.trim();
    const dob = block.querySelector('.child-dob').value;
    const school = block.querySelector('.child-school').value.trim();
    const grade = block.querySelector('.child-grade').value.trim();
    if (name) children.push({name, id, dob, school, grade});
  });
  
  if (children.length === 0) { alert('יש למלא לפחות ילד/ה אחד/ת'); return; }
  
  btn.disabled = true;
  btn.textContent = '⏳ שולח...';
  
  const timestamp = Date.now();
  const record = {
    timestamp: timestamp,
    date: new Date().toLocaleString('he-IL'),
    parentName: parentName,
    parentPhone: parentPhone,
    parentEmail: document.getElementById('parentEmail').value.trim(),
    parentAddress: document.getElementById('parentAddress').value.trim(),
    allergies: document.getElementById('allergies').value.trim(),
    notes: document.getElementById('notes').value.trim(),
    children: children,
    status: 'new'
  };
  
  try {
    // Save to Firebase
    const key = db.ref('registrations').push().key;
    await db.ref('registrations/' + key).set(record);
    
    // Send email notification
    try {
      const childList = children.map(function(c){return c.name + ' (' + c.grade + ')';}).join(', ');
      await emailjs.send("service_1lmf359", "template_lbuelop", {
        parent_name: parentName,
        parent_phone: parentPhone,
        parent_email: record.parentEmail || 'לא צוין',
        children: childList,
        allergies: record.allergies || 'ללא',
        notes: record.notes || 'ללא',
        date: record.date
      });
    } catch (e) { console.warn('email failed', e); }
    
    document.getElementById('formSection').style.display = 'none';
    document.getElementById('successSection').style.display = 'block';
  } catch (err) {
    alert('שגיאה בשמירה: ' + err.message);
    btn.disabled = false;
    btn.textContent = '📋 שליחת טופס הרשמה';
  }
}

function resetForm() {
  document.querySelectorAll('.child-block[data-child]').forEach(function(b, i){
    if (i > 0) b.remove();
  });
  childCount = 1;
  document.querySelectorAll('input[type="text"],input[type="tel"],input[type="email"],input[type="date"],textarea').forEach(function(el){el.value='';});
  document.getElementById('terms').checked = false;
  document.getElementById('successSection').style.display = 'none';
  document.getElementById('formSection').style.display = 'block';
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '📋 שליחת טופס הרשמה';
}
</script>

</body>
</html>
